<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline</title>
<style>
:root{color-scheme:light;--bg:#ffffff;--ink:#111111;--body:#5c5c66;--muted:#747983;--brand:#f7e300;--brand-soft:#fffce0;--brand-ink:#111111;--btn-ink:#111111;--focus:#111111}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111111;--ink:#f6f7f8;--body:#c7cbd1;--muted:#aeb4bd;--brand-soft:#1c1c1e;--brand-ink:#f7e300;--focus:#f7e300}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px 16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:28rem;text-align:center}
.icon{width:80px;height:80px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink)}
h1{margin:24px 0 0;font-size:1.5rem;line-height:1.3}
p{margin:12px 0 0;font-size:.875rem;line-height:1.6;color:var(--body)}
ul{margin:24px auto 0;padding:0;max-width:20rem;list-style:none;text-align:start;font-size:.875rem;color:var(--body)}
li{display:flex;gap:8px;margin-top:8px}
li::before{content:"";flex:none;width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--brand)}
button{margin-top:32px;min-height:44px;padding:0 24px;border:0;border-radius:999px;background:var(--brand);color:var(--btn-ink);font:inherit;font-size:.875rem;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.small{margin-top:16px;font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<main role="alert">
<div class="icon" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/></svg></div>
<h1 data-t="title">You're offline</h1>
<p data-t="description"></p>
<ul><li data-t="tipWifi"></li><li data-t="tipData"></li><li data-t="tipAirplane"></li></ul>
<button type="button" id="retry" data-t="retry" autofocus>Try again</button>
<p class="small" data-t="autoReturn" aria-live="polite"></p>
</main>
<script>
(function () {
  // Generated from messages/*.json "offline"; keep the two in sync.
  var messages = {"en": {"title": "You're offline", "description": "Your internet connection was interrupted. We'll bring you back to this page as soon as you're connected again.", "tipWifi": "Check your Wi-Fi or network cable.", "tipData": "Make sure mobile data is turned on.", "tipAirplane": "Turn off airplane mode.", "retry": "Try again", "checking": "Checking connection…", "autoReturn": "You'll be taken back automatically once you're online again."}, "de": {"title": "Sie sind offline", "description": "Ihre Internetverbindung wurde unterbrochen. Sobald Sie wieder verbunden sind, bringen wir Sie zu dieser Seite zurück.", "tipWifi": "Prüfen Sie Ihr WLAN oder Netzwerkkabel.", "tipData": "Stellen Sie sicher, dass mobile Daten aktiviert sind.", "tipAirplane": "Schalten Sie den Flugmodus aus.", "retry": "Erneut versuchen", "checking": "Verbindung wird geprüft…", "autoReturn": "Sie werden automatisch zurückgebracht, sobald Sie wieder online sind."}, "es": {"title": "Estás sin conexión", "description": "Tu conexión a internet se interrumpió. Te devolveremos a esta página en cuanto vuelvas a conectarte.", "tipWifi": "Revisa tu Wi-Fi o el cable de red.", "tipData": "Asegúrate de que los datos móviles estén activados.", "tipAirplane": "Desactiva el modo avión.", "retry": "Reintentar", "checking": "Comprobando la conexión…", "autoReturn": "Volverás automáticamente en cuanto tengas conexión de nuevo."}, "fr": {"title": "Vous êtes hors ligne", "description": "Votre connexion internet a été interrompue. Nous vous ramènerons sur cette page dès que vous serez reconnecté.", "tipWifi": "Vérifiez votre Wi-Fi ou votre câble réseau.", "tipData": "Assurez-vous que les données mobiles sont activées.", "tipAirplane": "Désactivez le mode avion.", "retry": "Réessayer", "checking": "Vérification de la connexion…", "autoReturn": "Vous serez ramené automatiquement dès que vous serez de nouveau en ligne."}, "ar": {"title": "أنت غير متصل", "description": "انقطع اتصالك بالإنترنت. سنعيدك إلى هذه الصفحة فور عودة الاتصال.", "tipWifi": "تحقق من شبكة Wi-Fi أو كابل الشبكة.", "tipData": "تأكد من تشغيل بيانات الجوال.", "tipAirplane": "أوقف وضع الطيران.", "retry": "إعادة المحاولة", "checking": "جارٍ التحقق من الاتصال…", "autoReturn": "ستعود تلقائيًا فور عودة الاتصال بالإنترنت."}};
  var cookie = document.cookie.match(/(?:^|; )NEXT_LOCALE=([^;]+)/);
  var lang = ((cookie && decodeURIComponent(cookie[1])) || navigator.language || "en").slice(0, 2).toLowerCase();
  var text = messages[lang] || messages.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = text.title;
  document.querySelectorAll("[data-t]").forEach(function (node) {
    node.textContent = text[node.getAttribute("data-t")];
  });

  // The service worker serves this file in place of the page the user
  // asked for, so reloading returns them to that page once it loads.
  var retry = document.getElementById("retry");
  var checking = false;
  function check() {
    if (checking) return;
    checking = true;
    retry.disabled = true;
    retry.textContent = text.checking;
    fetch(location.href, { method: "HEAD", cache: "no-store" })
      .then(function () { location.reload(); })
      .catch(function () {
        checking = false;
        retry.disabled = false;
        retry.textContent = text.retry;
      });
  }
  retry.addEventListener("click", check);
  window.addEventListener("online", check);
  setInterval(function () { if (navigator.onLine) check(); }, 5000);
})();
</script>
</body>
</html>
